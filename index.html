<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Square Box</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div style="
        width: 200px;
        height: 200px;
        background-color: #3498db; /* A vibrant blue */
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #ffffff; /* White text for contrast */
        font-size: 24px;
        font-weight: 600;
        padding: 20px;
        box-sizing: border-box; /* Ensure padding doesn't increase total size */
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        cursor: default;
    " onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 12px 24px rgba(0, 0, 0, 0.3)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 8px 16px rgba(0, 0, 0, 0.2)';">
        Hello World!
    </div>

</body>
</html>
