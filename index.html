<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: #121212; /* Very dark background */
            color: #e0e0e0; /* Light grey text */
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background-color: #39FF14; /* Bright Neon Green */
            color: #1a1a1a; /* Dark text for high contrast */
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4); /* Neon shadow */
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 1.8em;
            color: #f0f0f0;
            margin-bottom: 25px;
            border-bottom: 2px solid #39FF14; /* Neon green underline */
            padding-bottom: 10px;
            display: inline-block;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Responsive grid */
            gap: 30px;
            margin-top: 20px;
        }

        .metric-card {
            background-color: #2c2c2c; /* Slightly lighter dark grey for cards */
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); /* Darker shadow for depth */
            border: 1px solid #3a3a3a; /* Subtle border */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(57, 255, 20, 0.3); /* Enhanced shadow and subtle neon glow */
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #39FF14, transparent); /* Neon line at top */
            border-radius: 12px 12px 0 0;
            opacity: 0.7;
        }

        .metric-card h3 {
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.5em;
            color: #f0f0f0;
            font-weight: 700;
        }

        .metric-card .value {
            font-size: 2.8em;
            font-weight: 700;
            color: #39FF14; /* Neon green for values */
            margin-bottom: 15px;
            display: block;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
        }

        .metric-card .description {
            font-size: 0.95em;
            color: #b0b0b0;
            margin-bottom: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            .main-content {
                padding: 20px;
            }
            .metrics-grid {
                grid-template-columns: 1fr; /* Stack cards on smaller screens */
            }
            .metric-card {
                padding: 20px;
            }
            .metric-card .value {
                font-size: 2.5em;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
            }
            .header {
                padding: 15px 20px;
            }
            .main-content {
                padding: 15px;
            }
            .section-title {
                font-size: 1.5em;
            }
            .metric-card .value {
                font-size: 2.2em;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <h1>Dashboard Overview</h1>
        </header>

        <main class="main-content">
            <h2 class="section-title">Key Metrics</h2>
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="value">12,345</span>
                    <h3>Total Users</h3>
                    <p class="description">Current active users in the system.</p>
                </div>

                <div class="metric-card">
                    <span class="value">$9,876.50</span>
                    <h3>Revenue (Today)</h3>
                    <p class="description">Generated revenue for the current day.</p>
                </div>

                <div class="metric-card">
                    <span class="value">98.7%</span>
                    <h3>Uptime</h3>
                    <p class="description">System availability over the last 30 days.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
