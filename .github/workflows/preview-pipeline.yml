name: Elio Tax Dynamic Preview Return Loop

on:
  push:
    branches:
      - feature-slack-orchestration-v2 # Target your active generation branch specifically

jobs:
  orchestrate-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v6

      - name: Ensure Staging PR Exists
        id: manage_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If a PR is already open for this branch, find its number. If not, create it.
          EXISTING_PR=$(gh pr list --head "feature-slack-orchestration-v2" --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            NEW_PR=$(gh pr create \
              --base master \
              --head "feature-slack-orchestration-v2" \
              --title "🤖 Live AI Preview Sandbox" \
              --body "This sandbox is dynamically updated by your Gemini Slack Agent prompts.")
            PR_NUM=$(echo "$NEW_PR" | grep -oE '[0-9]+$')
          else
            PR_NUM=$EXISTING_PR
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Extract Dynamic Render Preview URL
        id: get_render_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Monitoring PR #Links for Render's deployment confirmation..."
          # Give Render a few seconds to parse the new commit head
          sleep 15 

          RENDER_URL=""
          # Loop for up to 2 minutes checking the PR comments where Render leaves its links
          for i in {1..12}; do
            RENDER_URL=$(gh pr view ${{ steps.manage_pr.outputs.pr_number }} --json comments --jq '.comments[].body' | grep -oE 'https://[^ ]+\.onrender\.com' | head -n 1 || true)
            if [ ! -z "$RENDER_URL" ]; then
              break
            fi
            echo "Render environment is still building, checking again in 10 seconds... ($i/12)"
            sleep 10
          done

          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://dashboard.render.com (Build took longer than expected, check dashboard status)"
          fi
          echo "preview_url=$RENDER_URL" >> $GITHUB_OUTPUT

      - name: Post Sandbox Link Back to Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎨 *Your Dynamic Component is Ready!*\nGemini has successfully compiled your layout change.\n👉 *Live Preview Sandbox:* ${{ steps.get_render_url.outputs.preview_url }}"
            }
