name: Elio Tax Dynamic Preview Return Loop

on:
  push:
    branches-ignore:
      - master
      - main

jobs:
  orchestrate-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v6

      - name: Ensure Staging PR Exists
        id: manage_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If a PR is already open for this branch, find its number. If not, create it.
          EXISTING_PR=$(gh pr list --head "feature-slack-orchestration-v2" --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            NEW_PR=$(gh pr create \
              --base master \
              --head "feature-slack-orchestration-v2" \
              --title "🤖 Live AI Preview Sandbox" \
              --body "This sandbox is dynamically updated by your Gemini Slack Agent prompts.")
            PR_NUM=$(echo "$NEW_PR" | grep -oE '[0-9]+$')
          else
            PR_NUM=$EXISTING_PR
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Extract Dynamic Render Preview URL
        id: get_render_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for Render to complete the deployment pipeline..."
          # Give Render up to 3 minutes to spin up the container and update status
          sleep 30
          
          RENDER_URL=""
          for i in {1..15}; do
            # Query GitHub's check-runs API where Render reports its active preview links
            RENDER_URL=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs[] | select(.app.name=="Render") | .details_url' | head -n 1 || true)
            
            if [ ! -z "$RENDER_URL" ] && [[ "$RENDER_URL" == *"render.com"* || "$RENDER_URL" == *".onrender.com"* ]]; then
              break
            fi
            echo "Render environment is compiling assets... checking status again in 10 seconds ($i/15)"
            sleep 10
          done

          if [ -z "$RENDER_URL" ]; then
            # Final fallback strategy: Construct the predictable PR sandbox URL string layout manually
            RENDER_URL="https://my-instance-issue-to-live-preview-1-pr-${{ steps.manage_pr.outputs.pr_number }}.onrender.com"
          fi
          echo "preview_url=$RENDER_URL" >> $GITHUB_OUTPUT

      - name: Post Sandbox Link Back to Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🎨 *Your Dynamic Component is Ready!*\nGemini has successfully compiled your layout change.\n👉 *Live Preview Sandbox:* ${{ steps.get_render_url.outputs.preview_url }}"
            }
