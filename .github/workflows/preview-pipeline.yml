name: Elio Tax AI Agent Feedback Loop

on:
  push:
    branches-ignore:
      - master
      - main

jobs:
  orchestrate-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v6

      - name: Auto-Create Active Staging PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the PR programmatically
          NEW_PR=$(gh pr create \
            --base master \
            --head "${{ github.ref_name }}" \
            --title "🤖 AI Generation: ${{ github.ref_name }}" \
            --body "This PR was generated automatically by your Gemini Slack Agent.")
          
          PR_NUM=$(echo "$NEW_PR" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Wait for Render Deployment Link
        id: get_render_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for Render to assign the preview URL..."
          # Sleep briefly to allow Render to register the incoming PR hook
          sleep 15 
          
          # Query the GitHub PR API to extract the deployment output URL generated by Render
          RENDER_URL=""
          for i in {1..12}; do
            RENDER_URL=$(gh pr view ${{ steps.create_pr.outputs.pr_number }} --json comments --jq '.comments[].body' | grep -oE 'https://[^ ]+\.onrender\.com' | head -n 1 || true)
            if [ ! -z "$RENDER_URL" ]; then
              break
            fi
            echo "URL not ready yet, checking again in 10 seconds... (Attempt $i/12)"
            sleep 10
          done

          if [ -z "$RENDER_URL" ]; then
            # Fallback string if API collection takes longer than 2 minutes
            RENDER_URL="https://dashboard.render.com (Check dashboard status)"
          fi
          echo "preview_url=$RENDER_URL" >> $GITHUB_OUTPUT

      - name: Send Live Preview Link Back To Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 *AI Deployment Complete!*\nYour changes on branch `sadullah` are live.\n👉 *Preview URL:* ${{ steps.get_render_url.outputs.preview_url }}"
            }